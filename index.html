<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бібліотека Валентини — каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  :root{
    --bg:#141317;
    --bg-2:#0e0d10;
    --panel:#1d1c22;
    --panel-raised:#242229;
    --frame:#302d36;
    --frame-light:#3d3944;
    --ink:#f2efe9;
    --ink-soft:#9d97a8;
    --ink-dim:#6b6674;
    --glow:#ffb454;
    --glow-deep:#e0912e;
    --violet:#a78bfa;
    --line:#2b2830;
  }
  body{
    background:
      radial-gradient(ellipse 900px 400px at 50% -5%, rgba(255,180,84,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 8%, var(--bg) 100%);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
  }

  /* ===== Header ===== */
  header{
    padding:52px 24px 30px;
    text-align:center;
    position:relative;
  }
  .light-strip{
    position:absolute;
    left:50%; transform:translateX(-50%);
    bottom:-1px;
    width:min(700px, 86%);
    height:2px;
    background:linear-gradient(90deg, transparent, var(--glow) 20%, var(--glow) 80%, transparent);
    box-shadow:0 0 24px 3px rgba(255,180,84,0.55), 0 0 60px 10px rgba(255,180,84,0.15);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--glow);
    margin-bottom:12px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-optical-sizing:auto;
    font-size:clamp(34px,5.2vw,54px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:15px;
    font-style:italic;
  }
  .stats-row{
    display:flex;
    justify-content:center;
    gap:32px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  .stat{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:.04em;
  }
  .stat b{
    color:var(--glow);
    font-size:19px;
    font-family:'Fraunces', serif;
    font-weight:700;
    display:block;
    margin-bottom:2px;
  }

  /* ===== Controls ===== */
  .controls{
    max-width:960px;
    margin:0 auto;
    padding:34px 24px 8px;
  }
  .search-wrap{
    position:relative;
    margin-bottom:22px;
  }
  .search-wrap label{
    position:absolute;
    left:16px; top:-9px;
    background:var(--bg);
    padding:0 6px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--glow);
  }
  #search{
    width:100%;
    padding:15px 16px;
    font-family:'Source Serif 4', serif;
    font-size:16px;
    font-style:italic;
    background:var(--panel);
    border:1.5px solid var(--frame);
    border-radius:6px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #search::placeholder{color:var(--ink-dim);}
  #search:focus{border-color:var(--glow); box-shadow:0 0 0 3px rgba(255,180,84,0.12);}

  .drawer-row-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:14px 0 8px 2px;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:6px;
  }
  .tab{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.03em;
    padding:8px 13px;
    background:var(--panel);
    border:1px solid var(--frame);
    border-radius:5px;
    cursor:pointer;
    color:var(--ink-soft);
    user-select:none;
    transition:all .14s ease;
    position:relative;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .tab .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--tab-hue, var(--glow));
    box-shadow:0 0 6px 0 var(--tab-hue, var(--glow));
    flex:none;
  }
  .tab:hover{
    border-color:var(--frame-light);
    color:var(--ink);
    transform:translateY(-1px);
  }
  .tab.active{
    background:var(--tab-hue, var(--glow));
    border-color:var(--tab-hue, var(--glow));
    color:#141317;
    font-weight:600;
    box-shadow:0 0 16px -2px var(--tab-hue, var(--glow));
  }
  .tab.active .dot{background:#141317; box-shadow:none;}
  .tab .count{
    opacity:.6;
    font-size:10px;
  }

  .clear-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    background:none;
    border:1px solid var(--frame);
    color:var(--ink-dim);
    padding:7px 12px;
    border-radius:5px;
    cursor:pointer;
    margin-top:4px;
  }
  .clear-btn:hover{border-color:var(--glow); color:var(--glow);}

  /* ===== Results ===== */
  main{
    max-width:960px;
    margin:0 auto;
    padding:20px 24px 90px;
  }
  .result-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:.05em;
    margin:10px 2px 18px;
    display:flex;
    justify-content:space-between;
  }
  .result-meta .active-filter{ color:var(--glow); }

  .shelf-group{
    margin-bottom:22px;
    background:var(--panel);
    border:1px solid var(--frame);
    border-radius:10px;
    overflow:hidden;
  }
  .shelf-heading{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:14px 16px;
    border-bottom:1px solid var(--frame);
    display:flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(180deg, var(--panel-raised), var(--panel));
  }
  .shelf-heading .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--tab-hue, var(--glow));
    box-shadow:0 0 8px 1px var(--tab-hue, var(--glow));
    flex:none;
  }
  .shelf-heading .name{ color:var(--ink); }
  .shelf-heading .n{
    font-family:'JetBrains Mono', monospace;
    font-weight:400;
    font-size:10px;
    color:var(--ink-dim);
    text-transform:none;
    letter-spacing:0;
    margin-left:auto;
  }
  .book{
    display:grid;
    grid-template-columns:46px 1fr auto;
    gap:2px 14px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    align-items:center;
  }
  .book:last-child{border-bottom:none;}
  .book:hover{background:rgba(255,180,84,0.035);}

  .cover{
    grid-row:1/3;
    width:44px; height:64px;
    border-radius:3px;
    overflow:hidden;
    background:var(--cover-hue, var(--glow-deep));
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(0,0,0,0.35);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06), 0 2px 6px rgba(0,0,0,0.35);
    flex:none;
  }
  .cover img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .cover .letter{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:19px;
    color:rgba(0,0,0,0.55);
  }

  .book-title{
    grid-column:2;
    font-size:16px;
    color:var(--ink);
    line-height:1.32;
  }
  .book-author{
    grid-column:2;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:.02em;
    margin-top:3px;
  }
  .badge{
    grid-column:3;
    grid-row:1/3;
    align-self:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.05em;
    background:rgba(167,139,250,0.16);
    color:var(--violet);
    border:1px solid rgba(167,139,250,0.4);
    padding:4px 9px;
    border-radius:10px;
    white-space:nowrap;
    height:fit-content;
  }
  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-dim);
    font-style:italic;
  }
  .empty-state .big{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-style:normal;
    color:var(--ink);
    margin-bottom:6px;
  }

  footer{
    text-align:center;
    padding:26px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--ink-dim);
    border-top:1px solid var(--line);
  }

  @media (max-width:600px){
    header{padding:40px 16px 24px;}
    .stats-row{gap:20px;}
    .book{grid-template-columns:40px 1fr; row-gap:4px;}
    .badge{grid-column:1/3; grid-row:auto; justify-self:start; margin-top:2px;}
    .cover{grid-row:1/3; width:38px; height:54px;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Домашній архів · картотека</div>
  <h1>Бібліотека</h1>

  </div>
  <div class="light-strip"></div>
</header>

<div class="controls">
  <div class="search-wrap">
    <label for="search">Пошук</label>
    <input id="search" type="text" placeholder="автор, назва або коментар…" autocomplete="off">
  </div>

  <div class="drawer-row-label">Ліва шафа</div>
  <div class="tabs" id="tabs-left"></div>
  <div class="drawer-row-label">Права шафа</div>
  <div class="tabs" id="tabs-right"></div>
  <button class="clear-btn" id="clear-filter">Скинути фільтр полиці ×</button>
</div>

<main>
  <div class="result-meta">
    <span id="result-count">—</span>
    <span class="active-filter" id="active-filter"></span>
  </div>
  <div id="results"></div>
</main>

<footer>Оновлено вручну · дані з файлу «Бібліотека» · обкладинки: Google Books / openlibrary.org</footer>

or": "Деніел Канеман, Олів’є Сібоні, Касс Санстейн", "title": "Шум. Хибність людських суджень", "comment": ""}, {"shelf": "R12", "author": "Тімоті Снайдер", "title": "Про тиранію. Двадцять уроків ХХ століття", "comment": ""}, {"shelf": "R12", "author": "", "title": "501 факт, які треба знати з історії", "comment": ""}, {"shelf": "R12", "author": "Войцех Тохман", "title": "Пляння півнів, плач псів", "comment": ""}, {"shelf": "R12", "author": "Войцех Тохман", "title": "Ти наче камінь їла", "comment": ""}, {"shelf": "R12", "author": "Майкл Мослі", "title": "Розумний кишківник", "comment": ""}, {"shelf": "R12", "author": "Александра Вулф", "title": "Долина богів", "comment": ""}, {"shelf": "R12", "author": "Олівер Беркмен", "title": "4000 тижнів. Тайм-менеджмент для смертних", "comment": ""}];

const shelfOrder = s => [s[0], parseInt(s.slice(1),10)];
const allShelves = [...new Set(BOOKS.map(b=>b.shelf).filter(Boolean))]
  .sort((a,b)=>{
    const [la,na] = shelfOrder(a), [lb,nb] = shelfOrder(b);
    return la===lb ? na-nb : la.localeCompare(lb);
  });
const leftShelves = allShelves.filter(s=>s.startsWith('L'));
const rightShelves = allShelves.filter(s=>s.startsWith('R'));

// vivid spine-like hue per shelf, spread across a rich saturated spectrum
const HUES = [355, 18, 32, 45, 150, 168, 190, 205, 265, 285, 320, 340];
function shelfHue(shelf){
  const idx = allShelves.indexOf(shelf);
  const h = HUES[idx % HUES.length];
  return h;
}
function shelfColor(shelf, sat=72, light=58){
  return 'hsl(' + shelfHue(shelf) + 'deg ' + sat + '% ' + light + '%)';
}

let activeShelf = null;
let query = '';

function shelfCount(s){ return BOOKS.filter(b=>b.shelf===s).length; }

function renderTabs(){
  const mk = (s) => {
    const el = document.createElement('div');
    el.className = 'tab' + (activeShelf===s ? ' active' : '');
    el.style.setProperty('--tab-hue', shelfColor(s));
    el.innerHTML = '<span class="dot"></span>' + s + '<span class="count">' + shelfCount(s) + '</span>';
    el.onclick = () => { activeShelf = (activeShelf===s ? null : s); render(); };
    return el;
  };
  const left = document.getElementById('tabs-left');
  const right = document.getElementById('tabs-right');
  left.innerHTML=''; right.innerHTML='';
  leftShelves.forEach(s=>left.appendChild(mk(s)));
  rightShelves.forEach(s=>right.appendChild(mk(s)));
}

function normalize(s){ return (s||'').toLowerCase(); }

function filteredBooks(){
  let list = BOOKS;
  if(activeShelf) list = list.filter(b=>b.shelf===activeShelf);
  if(query.trim()){
    const q = normalize(query);
    list = list.filter(b =>
      normalize(b.author).includes(q) ||
      normalize(b.title).includes(q) ||
      normalize(b.comment).includes(q)
    );
  }
  return list;
}

// ---- cover loading (lazy, via Google Books, then Open Library as fallback) ----
const coverCache = new Map(); // key -> url|null
let observer;
function coverKey(b){ return (b.title||'') + '||' + (b.author||''); }

function ensureObserver(){
  if(observer) return observer;
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        loadCover(entry.target);
        observer.unobserve(entry.target);
      }
    });
  }, {rootMargin:'200px'});
  return observer;
}

async function tryGoogleBooks(title, author){
  const attempts = [];
  if(title && author) attempts.push('intitle:' + title + '+inauthor:' + author);
  if(title) attempts.push('intitle:' + title);
  for(const q of attempts){
    try{
      const url = 'https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(q) + '&maxResults=1&country=US';
      const res = await fetch(url);
      if(!res.ok) continue;
      const data = await res.json();
      const item = data.items && data.items[0];
      const links = item && item.volumeInfo && item.volumeInfo.imageLinks;
      const thumb = links && (links.thumbnail || links.smallThumbnail);
      if(thumb) return thumb.replace('http://','https://').replace('zoom=1','zoom=2');
    }catch(e){ /* try next */ }
  }
  return null;
}

async function tryOpenLibrary(title){
  try{
    const url = 'https://openlibrary.org/search.json?title=' + encodeURIComponent(title) + '&fields=cover_i&limit=1';
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    const doc = data.docs && data.docs[0];
    return (doc && doc.cover_i) ? ('https://covers.openlibrary.org/b/id/' + doc.cover_i + '-M.jpg') : null;
  }catch(e){
    return null;
  }
}

async function loadCover(coverEl){
  const key = coverEl.dataset.key;
  const title = coverEl.dataset.title;
  const author = coverEl.dataset.author;
  if(coverCache.has(key)){
    applyCover(coverEl, coverCache.get(key));
    return;
  }
  if(!title){ coverCache.set(key, null); return; }

  let coverUrl = await tryGoogleBooks(title, author);
  if(!coverUrl) coverUrl = await tryOpenLibrary(title);

  coverCache.set(key, coverUrl);
  applyCover(coverEl, coverUrl);
}

function applyCover(coverEl, url){
  if(!url) return;
  const img = document.createElement('img');
  img.src = url;
  img.alt = '';
  img.loading = 'lazy';
  img.onload = ()=>{
    coverEl.innerHTML='';
    coverEl.appendChild(img);
  };
  img.onerror = ()=>{};
}

function render(){
  renderTabs();
  const list = filteredBooks();
  const results = document.getElementById('results');
  const countEl = document.getElementById('result-count');
  const filterEl = document.getElementById('active-filter');

  const n = list.length;
  const word = (n%10===1 && n%100!==11) ? ' книга' : ((n%10>=2 && n%10<=4 && (n%100<10||n%100>=20)) ? ' книги' : ' книг');
  countEl.textContent = n + word;
  filterEl.textContent = activeShelf ? ('полиця ' + activeShelf) : '';

  results.innerHTML = '';

  if(list.length===0){
    results.innerHTML = '<div class="empty-state"><div class="big">Нічого не знайдено</div>спробуйте інший запит або скиньте фільтр</div>';
    return;
  }

  const groups = {};
  list.forEach(b=>{
    const key = b.shelf || '—';
    if(!groups[key]) groups[key]=[];
    groups[key].push(b);
  });

  const orderedKeys = Object.keys(groups).sort((a,b)=>{
    if(a==='—') return 1;
    if(b==='—') return -1;
    const [la,na] = shelfOrder(a), [lb,nb] = shelfOrder(b);
    return la===lb ? na-nb : la.localeCompare(lb);
  });

  const obs = ensureObserver();

  orderedKeys.forEach(key=>{
    const groupEl = document.createElement('div');
    groupEl.className = 'shelf-group';
    const heading = document.createElement('div');
    heading.className = 'shelf-heading';
    if(key !== '—') heading.style.setProperty('--tab-hue', shelfColor(key));
    heading.innerHTML = '<span class="dot"></span><span class="name">' + key + '</span><span class="n">' + groups[key].length + (groups[key].length===1?' книга':' книг') + '</span>';
    groupEl.appendChild(heading);

    groups[key].forEach(b=>{
      const row = document.createElement('div');
      row.className = 'book';

      const cover = document.createElement('div');
      cover.className = 'cover';
      if(key !== '—') cover.style.setProperty('--cover-hue', shelfColor(key, 55, 30));
      cover.dataset.key = coverKey(b);
      cover.dataset.title = b.title || '';
      cover.dataset.author = b.author || '';
      const letter = document.createElement('span');
      letter.className = 'letter';
      letter.textContent = (b.title || '?').trim().charAt(0).toUpperCase();
      cover.appendChild(letter);
      if(b.title) obs.observe(cover);

      const titleEl = document.createElement('div');
      titleEl.className = 'book-title';
      titleEl.textContent = b.title || '(без назви)';

      const authorEl = document.createElement('div');
      authorEl.className = 'book-author';
      authorEl.textContent = b.author || '(автор невідомий)';

      row.appendChild(cover);
      row.appendChild(titleEl);
      if(b.comment){
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = b.comment;
        row.appendChild(badge);
      }
      row.appendChild(authorEl);

      groupEl.appendChild(row);
    });
    results.appendChild(groupEl);
  });
}

document.getElementById('search').addEventListener('input', (e)=>{
  query = e.target.value;
  render();
});
document.getElementById('clear-filter').addEventListener('click', ()=>{
  activeShelf = null;
  render();
});

document.getElementById('stat-total').textContent = BOOKS.length;
document.getElementById('stat-shelves').textContent = allShelves.length;
document.getElementById('stat-borrowed').textContent = BOOKS.filter(b=>b.comment).length;

render();
</script>
